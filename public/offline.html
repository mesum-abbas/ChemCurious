<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Offline | ChemCurious</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: #f8fafc; color: #1e293b;
      font-family: "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%; max-width: 420px; background: #fff; border: 1px solid rgb(226 232 240 / .8);
      border-radius: 16px; padding: 32px 24px; text-align: center; box-shadow: 0 1px 2px rgb(15 23 42 / .05);
    }
    .icon {
      width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px; display: grid; place-items: center;
      background: #f0fdfa; color: #0f766e; box-shadow: inset 0 0 0 1px #ccfbf1;
    }
    h1 { margin: 0 0 8px; font-size: 22px; color: #0f172a; }
    p { margin: 0 0 24px; font-size: 15px; line-height: 1.6; color: #475569; }
    button {
      height: 44px; padding: 0 24px; border: 0; border-radius: 999px; cursor: pointer;
      background: #0d9488; color: #fff; font: inherit; font-weight: 600;
    }
    button:hover { background: #0f766e; }
    button:focus-visible { outline: 3px solid #99f6e4; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01" /><path d="M8.5 16.43a5 5 0 0 1 7 0" /><path d="M5 12.86a10 10 0 0 1 5.17-2.69" />
        <path d="M19 12.86a10 10 0 0 0-2.01-1.48" /><path d="M2 8.82a15 15 0 0 1 4.18-2.65" />
        <path d="M22 8.82a15 15 0 0 0-11.29-3.76" /><path d="m2 2 20 20" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>ChemCurious needs an internet connection to load this page. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    // Reload automatically as soon as the connection comes back.
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
